# Copy this file to config.toml and fill it in. config.toml stays on your PC only.

[discord]
# Discord channel > Edit Channel > Integrations > Webhooks > New Webhook > Copy Webhook URL
webhook_url = ""

[gmail]
# Win emails are spotted by the Google script (phone/Code.gs) running in the Gmail account you use for comps.
# Set it up, run showLink in it, and paste the line it prints here.
relay_url = ""
# Only if you'd rather the PC read Gmail itself: the address and a Gmail app password (leave relay_url blank).
address = ""
app_password = ""

[me]
# Used to pre-fill entry forms. Leave anything blank that you don't want filled.
first_name = ""
last_name = ""
email = ""
phone = ""
address = ""
suburb = ""
state = ""           # e.g. NSW, VIC, QLD. Comps limited to other states are hidden.
postcode = ""
date_of_birth = ""   # YYYY-MM-DD
gender = ""
country = "Australia"

[feed]
check_every_minutes = 20
# Comps with any of these OzBargain tags are never shown to you.
exclude_categories = ["Purchase Required", "Recruit/Referral"]
# Comps whose title or description contains any of these are never shown to you.
exclude_keywords = ["new zealand only", "nz only", "nz residents only", "usa only", "us residents only", "uk only"]
# Hide comps run on Gleam (OzBargain's "Gleam" tag, or gleam.io / gle.am links). Set to false to see them again.
exclude_gleam = true
# Hide comps entered on Instagram (OzBargain's "Instagram" tag, instagram.com links, or Instagram in the
# title or description). Set to false to see them again.
exclude_instagram = true
# A comp you marked entered in the last this-many days is never shown again: re-posts of it on OzBargain are
# hidden, and Enter comps warns you if a comp opens on a website you entered a comp on. 0 turns this off.
# (Comps that say you can enter daily still come back each day.)
repeat_days = 30

[inbox]
# Win-like emails from a brand or site you've entered a comp with (pressed "e" in Enter comps) always ping you.
# For other senders: "quiet" posts them without a notification (spam-folder ones are dropped),
# "ignore" drops them, "alert" pings you like a real win.
unknown_senders = "quiet"
check_every_minutes = 10
# How far back to look the very first time it runs.
first_run_lookback_days = 14

[browser]
# "normal": Enter comps opens each comp in your own Chrome, where the Competition bot extension fills the form
#           (see README.md). The "Fill my details" bookmark still works if you'd rather not use the extension.
# "edge": Enter comps opens a separate Edge window that fills forms itself (Gleam comps still use your browser).
mode = "normal"
# In "normal" mode, open comps in this Chrome profile (the name shown in Chrome's profile menu).
# Leave blank to use your default browser.
chrome_profile = ""
# Without the extension: close the comp's Chrome tab when you press e or s in Enter comps.
close_tabs = true
# "msedge" (built into Windows 11), "chrome", or "" to try Edge, then Chrome, then Playwright's Chromium.
channel = "msedge"
